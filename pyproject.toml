[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aaax"
version = "0.3.1"
description = "Strategy shell for inspecting, mounting, and serving application packages, built on LLLM."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Junyan Cheng" }]
keywords = [
  "agents",
  "agentic systems",
  "strategy",
  "fastapi",
  "lllm",
  "sssn",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # lllm-core's server extra brings FastAPI and Uvicorn.
  "lllm-core[server]>=0.4",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Channel stores (attach_store, package channels, /network/) come from sssn.
channels = [
  "sssn>=0.2",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10.8",
  # pymdown-extensions 12.2 needs mkdocstrings 1.0.8, which needs Python 3.11.
  "pymdown-extensions<12.2; python_version < '3.11'",
]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10.8",
  "pymdown-extensions<12.2; python_version < '3.11'",
  "pytest>=8.0",
  "pytest-examples>=0.0.15",
  "sssn>=0.2",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://aaax.one"
Documentation = "https://aaax.one"
Repository = "https://github.com/Productive-Superintelligence/aaax"
Issues = "https://github.com/Productive-Superintelligence/aaax/issues"

[project.scripts]
aaax = "aaax.cli:main"

# Installing aaax adds `lllm shell` to the lllm command.
[project.entry-points."lllm.commands"]
shell = "aaax.cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["aaax*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
aaax = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
